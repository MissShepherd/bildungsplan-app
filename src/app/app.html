<header class="app-header">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          x="5"
          y="5"
          width="15"
          height="20"
          rx="3"
          stroke="currentColor"
          stroke-width="2.4"
        />

        <path
          d="M9 10h7M9 15h6M9 20h4"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        />

        <circle
          cx="21"
          cy="21"
          r="5"
          stroke="currentColor"
          stroke-width="2.4"
        />

        <path
          d="M25 25l3 3"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <span class="brand-title">Bildungsplan-App</span>
  </div>

  <nav class="main-nav" aria-label="Hauptnavigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Module
    </a>

    <a
      routerLink="/handlungskompetenzbereiche"
      routerLinkActive="active"
      class="nav-link"
    >
      Handlungskompetenzbereiche
    </a>

    <a
      routerLink="/handlungskompetenzen"
      routerLinkActive="active"
      class="nav-link"
    >
      Handlungskompetenzen
    </a>

    <a
      routerLink="/suche"
      routerLinkActive="active"
      class="nav-link"
    >
      Suche
    </a>
  </nav>

  <div class="header-actions" aria-label="Nicht aktive Benutzeraktionen">
    <button type="button" class="auth-button sign-in-button" disabled>
      Sign in
    </button>

    <button type="button" class="auth-button register-button" disabled>
      Register
    </button>
  </div>
</header>

<div class="app-shell">
  <app-filter-sidebar></app-filter-sidebar>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
