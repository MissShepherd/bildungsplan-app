<header class="app-header">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <span class="brand-title">Bildungsplan-App</span>
  </div>

  <nav class="main-nav" aria-label="Hauptnavigation">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Startseite
    </a>

    <a
      routerLink="/handlungskompetenzbereiche"
      routerLinkActive="active"
      class="nav-link"
    >
      Handlungskompetenzbereiche
    </a>

    <a
      routerLink="/handlungskompetenzen"
      routerLinkActive="active"
      class="nav-link"
    >
      Handlungskompetenzen
    </a>
  </nav>

  <div class="header-actions" aria-label="Nicht aktive Benutzeraktionen">
    <button type="button" class="auth-button sign-in-button" disabled>
      Sign in
    </button>

    <button type="button" class="auth-button register-button" disabled>
      Register
    </button>
  </div>
</header>

<div class="app-shell">
  <app-filter-sidebar></app-filter-sidebar>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>

<main class="app-layout">
  <app-filter-sidebar></app-filter-sidebar>

  <section class="app-content">
    <router-outlet></router-outlet>
  </section>
</main>
